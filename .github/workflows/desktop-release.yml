name: Desktop Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag and package versions
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          if ($packageVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match package.json version $packageVersion"
          }

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - name: Type-check and test
        run: |
          npm run typecheck
          npm test

      - name: Build and publish NSIS release
        run: npm run desktop:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
