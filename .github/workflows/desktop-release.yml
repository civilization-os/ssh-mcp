name: Desktop Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag and package versions
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          if ($packageVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match package.json version $packageVersion"
          }

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - name: Type-check and test
        run: |
          npm run typecheck
          npm test

      - name: Build NSIS release
        run: npm run desktop:dist

      - name: Publish GitHub release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}"
          $assets = @(
            "release/SSH-MCP Desktop-Setup-$version-x64.exe",
            "release/SSH-MCP Desktop-Setup-$version-x64.exe.blockmap",
            "release/latest.yml"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Release asset was not generated: $asset"
            }
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets --title $version --generate-notes --verify-tag
          }
